[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-backend"
version = "0.4.0"
description = "Local-first MOSAIC assistant backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn[standard]>=0.30,<1", "psutil>=5.9,<8"]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<0.6"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
